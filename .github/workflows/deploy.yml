name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
    # The worker commits breezeway.json / breezeway_tomorrow.json every 15 minutes.
    # Each one used to request a new Pages deployment that cancelled the previous
    # (still-running) one, so a full deploy never finished and the board froze.
    # The wall board now reads these files live from raw.githubusercontent, so we
    # no longer need to republish Pages when only the data changes — ignore them
    # here. Real content changes (wall.html, index.html, etc.) still deploy.
    paths-ignore:
      - 'breezeway.json'
      - 'breezeway_tomorrow.json'

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one Pages deployment at a time, and let an in-progress one finish
# rather than cancelling it.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
