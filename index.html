<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Operations Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;700;800;900&family=Barlow:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0d0d1a;overflow:hidden}
body{font-family:'Barlow',sans-serif;display:flex;flex-direction:column}

/* ── HEADER ── */
.hdr{background:#0a0a14;border-bottom:2px solid #1a1a30;padding:0 20px;height:52px;
  display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.hdr-logo{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:900;
  letter-spacing:3px;text-transform:uppercase;color:#fff}
.hdr-logo span{color:#00e5ff}
.hdr-center{display:flex;gap:0}
.date-btn{padding:0 18px;height:52px;display:flex;align-items:center;
  font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;
  letter-spacing:2px;text-transform:uppercase;color:#999;cursor:pointer;
  border-bottom:3px solid transparent;transition:all .2s}
.date-btn.on{color:#00e5ff;border-bottom-color:#00e5ff}
.date-btn:hover{color:#fff}
.hdr-right{display:flex;align-items:center;gap:20px}
.hdr-clock{font-family:'DM Mono',monospace;font-size:18px;color:#00e5ff;letter-spacing:2px}
.hdr-date{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;
  letter-spacing:1px;color:#aaa;text-transform:uppercase}
.refresh-wrap{display:flex;align-items:center;gap:6px}
.rdot{width:6px;height:6px;border-radius:50%;background:#00e5ff;animation:pulse 2s infinite}
.rtime{font-family:'DM Mono',monospace;font-size:11px;color:#333}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* ── WALLBOARD ── */
.wb{flex:1;display:grid;grid-template-columns:repeat(5,1fr);
  grid-auto-rows:auto;grid-auto-flow:row;
  gap:4px;padding:4px;min-height:0;overflow:auto}

/* ── SECTION ROWS ── */
.section-bar{grid-column:span 5;background:#0a0a14;display:flex;align-items:center;
  padding:0 14px;gap:10px;height:26px}
.section-bar-label{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:800;
  letter-spacing:3px;text-transform:uppercase;color:#fff}
.section-bar-line{flex:1;height:1px;background:#1a1a2e}
.section-bar-source{font-family:'DM Mono',monospace;font-size:9px;color:#555;letter-spacing:1px}

/* ── TILES ── */
.tile{position:relative;display:flex;flex-direction:column;justify-content:space-between;
  padding:14px 18px;cursor:pointer;overflow:hidden;transition:filter .15s;min-height:0}
.tile:hover{filter:brightness(1.12)}
.tile:active{filter:brightness(.9);transform:scale(.99)}
.nodata-banner{grid-column:1/-1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;text-align:center;padding:32px 20px;gap:8px;
  background:rgba(255,170,0,.06);border:1px solid rgba(255,170,0,.25);border-radius:10px}
.nodata-title{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:800;
  letter-spacing:.5px;color:#ffaa00;text-transform:uppercase}
.nodata-sub{font-family:'Barlow',sans-serif;font-size:14px;color:#ccc;max-width:520px;line-height:1.4}
.nodata-back{margin-top:6px;font-family:'DM Mono',monospace;font-size:12px;color:#00e5ff;
  cursor:pointer;letter-spacing:1px;padding:6px 14px;border:1px solid rgba(0,229,255,.4);border-radius:6px}
.nodata-back:hover{background:rgba(0,229,255,.12)}

.t-label{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;
  letter-spacing:1.5px;text-transform:uppercase;color:rgba(255,255,255,.65);line-height:1}
.t-num{font-family:'Barlow Condensed',sans-serif;font-weight:900;line-height:1;
  color:#fff;letter-spacing:-2px;font-size:80px;flex:1;display:flex;align-items:center}
.t-num.md{font-size:60px}
.t-num.sm{font-size:40px}
.t-num.xs{font-size:28px;letter-spacing:0;font-weight:700;font-family:'Barlow',sans-serif;line-height:1.3}
.t-sub{font-family:'DM Mono',monospace;font-size:10px;color:rgba(255,255,255,.72);letter-spacing:.5px}
.t-link{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;
  letter-spacing:1px;text-transform:uppercase;color:rgba(255,255,255,.4);
  position:absolute;bottom:12px;right:14px}

/* Colour scheme */
.c-cyan{background:#006080}
.c-blue{background:#003d8f}
.c-green{background:#006630}
.c-teal{background:#005544}
.c-purple{background:#4a1a7a}
.c-orange{background:#7a3300}
.c-amber{background:#7a5500}
.c-red{background:#7a0022}
.c-gl{background:#0f3d20}
.c-gl2{background:#1a5c2e}
.c-dark{background:#0f0f22}
.c-alert-ok{background:#004d20}
.c-alert-warn{background:#7a2200}
.c-nav{background:#0a0a1a;border:1px solid #1a1a30}

/* Estate tile colours — distinct but related shades */
.c-estate1{background:#1a4d6e}  /* Hoburne — deep teal */
.c-estate2{background:#2d5a3a}  /* Lake Pochard — forest green */
.c-estate3{background:#4a3a6e}  /* Lower Mill — indigo */
.c-estate4{background:#6e3a5a}  /* Windrush — plum */
.c-estate5{background:#5a4a2a}  /* Hareside — bronze */

/* Compact estate list inside the "By Estate" overview tile */
.est-list{flex:1;display:flex;flex-direction:column;justify-content:center;gap:6px;
  font-family:'Barlow Condensed',sans-serif;color:#fff;padding:8px 0}
.est-list-row{display:flex;justify-content:space-between;align-items:baseline;
  font-size:18px;font-weight:700;letter-spacing:1px}
.est-list-row .est-code{color:rgba(255,255,255,.85)}
.est-list-row .est-vals{font-family:'DM Mono',monospace;font-size:14px;color:#fff}
.est-list-row.dim{opacity:.35}

/* Estate-grid modal — opens when "By Estate" tile is tapped */
.est-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:4px 0}
.est-card{padding:14px 16px;border-radius:6px;cursor:pointer;transition:filter .15s;
  display:flex;flex-direction:column;gap:6px;min-height:96px}
.est-card:hover{filter:brightness(1.15)}
.est-card:active{transform:scale(.98)}
.est-card-label{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;
  letter-spacing:1.5px;text-transform:uppercase;color:rgba(255,255,255,.7)}
.est-card-num{font-family:'Barlow Condensed',sans-serif;font-size:30px;font-weight:900;
  line-height:1;color:#fff;letter-spacing:-1px}
.est-card-sub{font-family:'DM Mono',monospace;font-size:10px;color:rgba(255,255,255,.55);
  letter-spacing:.5px;margin-top:auto}

/* ── DETAIL PANEL ── */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:300;
  align-items:center;justify-content:center;padding:20px}
.overlay.on{display:flex}
.panel{background:#0f0f22;border-top:4px solid #00e5ff;border-radius:4px;
  width:100%;max-width:660px;max-height:88vh;display:flex;flex-direction:column}
.panel-hdr{display:flex;align-items:center;justify-content:space-between;
  padding:14px 20px;border-bottom:1px solid #1a1a30;flex-shrink:0}
.panel-title{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:900;
  letter-spacing:2px;text-transform:uppercase;color:#00e5ff}
.panel-close{font-size:22px;cursor:pointer;color:#999;background:none;border:none;line-height:1;padding:4px}
.panel-body{padding:16px 20px;overflow-y:auto;flex:1}
.panel-action{display:flex;justify-content:flex-end;padding:8px 20px;border-bottom:1px solid #1a1a30;background:#0a0a14}
.panel-action a{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;
  letter-spacing:1.5px;text-transform:uppercase;color:#00e5ff;text-decoration:none;
  padding:6px 12px;border:1px solid #1a3a4a;border-radius:3px;transition:all .15s}
.panel-action a:hover{background:rgba(0,229,255,.08);border-color:#00e5ff}
.p-row{display:flex;align-items:center;justify-content:space-between;
  padding:10px 0;border-bottom:1px solid #111}
.p-row:last-child{border-bottom:none}
.p-lodge{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700;
  letter-spacing:.5px;color:#fff}
.p-info{font-family:'DM Mono',monospace;font-size:11px;color:#aaa}
.p-status{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.s-done{background:#00a651}.s-pending{background:#f4a261}.s-none{background:#222}
.s-issue{background:#ff4466}.s-progress{background:#f4a261}.s-notstarted{background:#666}
.p-val{font-family:'DM Mono',monospace;font-size:18px;font-weight:700}
.p-empty{text-align:center;padding:40px;font-family:'Barlow Condensed',sans-serif;
  font-size:14px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#333}

/* BW property breakdown rows */
.bw-row{display:flex;align-items:center;justify-content:space-between;
  padding:8px 0;border-bottom:1px solid #111}
.bw-row:last-child{border-bottom:none}
.bw-name{font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;
  color:#fff;flex:1}
.bw-counts{display:flex;gap:8px;align-items:center}
.bw-count{font-family:'DM Mono',monospace;font-size:12px;padding:2px 8px;border-radius:3px;
  font-weight:700;min-width:32px;text-align:center}

/* Expandable property row (All Properties panel) */
.bw-row.expandable{cursor:pointer;transition:background .12s}
.bw-row.expandable:hover{background:rgba(255,255,255,.03)}
.bw-caret{font-family:'DM Mono',monospace;font-size:11px;color:#888;
  margin-right:8px;display:inline-block;width:10px;transition:transform .15s}
.bw-row.open .bw-caret{transform:rotate(90deg);color:#00e5ff}
.bw-prop-tasks{display:none;padding:2px 0 10px 14px;
  border-left:2px solid #1a3a4a;margin:0 0 0 2px}
.bw-prop-tasks.open{display:block}

/* Task filter bar (department pills + name search) at the top of BW task panels */
.bw-filter{padding:2px 0 12px 0;border-bottom:1px solid #1a1a30;margin-bottom:10px}
.bw-filt-pills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.bw-filt-pill{background:rgba(255,255,255,.06);color:#bbb;border:1px solid #2a2a45;
  border-radius:12px;padding:5px 12px;font-family:'DM Mono',monospace;font-size:12px;
  letter-spacing:.5px;cursor:pointer;transition:background .12s,color .12s,border-color .12s}
.bw-filt-pill:hover{background:rgba(255,255,255,.12);color:#e8e8e8}
.bw-filt-pill.on{background:rgba(0,229,255,.18);color:#00e5ff;border-color:#00e5ff}
.bw-filt-row{display:flex;align-items:center;gap:8px}
.bw-filt-search{flex:1;min-width:0;background:rgba(255,255,255,.05);border:1px solid #2a2a45;
  border-radius:8px;color:#e8e8e8;padding:7px 10px;font-family:'DM Mono',monospace;
  font-size:13px;outline:none}
.bw-filt-search:focus{border-color:#00e5ff}
.bw-filt-search::placeholder{color:#666}
.bw-filt-clear{background:none;border:1px solid #2a2a45;border-radius:8px;color:#999;
  padding:7px 10px;font-family:'DM Mono',monospace;font-size:12px;cursor:pointer;white-space:nowrap}
.bw-filt-clear:hover{color:#ff4466;border-color:#ff4466}
.bw-filt-count{font-family:'DM Mono',monospace;font-size:11px;color:#999;
  white-space:nowrap;letter-spacing:.5px}
.bw-filt-grp{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-bottom:7px}
.bw-filt-lab{font-family:'DM Mono',monospace;font-size:10px;color:#666;letter-spacing:1px;
  text-transform:uppercase;min-width:52px;flex:0 0 auto}
.bw-filt-mine{background:rgba(155,109,255,.15);color:#c9a3ff;border:1px solid rgba(155,109,255,.45);
  border-radius:12px;padding:5px 14px;font-family:'DM Mono',monospace;font-size:12px;
  font-weight:700;letter-spacing:.5px;cursor:pointer;transition:background .12s,color .12s}
.bw-filt-mine:hover{background:rgba(155,109,255,.28)}
.bw-filt-mine.on{background:#9b6dff;color:#fff;border-color:#9b6dff}
.bw-filt-sel{background:rgba(255,255,255,.05);border:1px solid #2a2a45;border-radius:8px;
  color:#e8e8e8;padding:7px 8px;font-family:'DM Mono',monospace;font-size:12px;
  outline:none;max-width:200px;flex:0 1 auto}
.bw-filt-sel:focus{border-color:#00e5ff}
.bw-queue-badge{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);
  background:rgba(255,170,0,.18);border:1px solid rgba(255,170,0,.55);color:#ffc457;
  padding:9px 16px;border-radius:20px;font-family:'DM Mono',monospace;font-size:12px;
  letter-spacing:.5px;z-index:9999;cursor:pointer;box-shadow:0 4px 18px rgba(0,0,0,.45)}
.bw-queue-badge:hover{background:rgba(255,170,0,.3)}
.bw-scope-note{display:flex;align-items:center;gap:8px;padding:8px 12px;margin-bottom:10px;
  background:rgba(155,109,255,.12);border:1px solid rgba(155,109,255,.35);border-radius:8px;
  color:#c9a3ff;font-family:'DM Mono',monospace;font-size:12px;letter-spacing:.5px}

/* Task-detail row inside a panel — stacked two-line layout */
.bw-task{padding:13px 0;border-bottom:1px solid rgba(255,255,255,.35);position:relative}
.bw-done-btn{position:absolute;top:8px;right:0;background:rgba(0,230,118,.12);color:#00e676;
  border:1px solid rgba(0,230,118,.4);border-radius:6px;font-size:11px;font-weight:700;
  padding:4px 12px;cursor:pointer;font-family:inherit;letter-spacing:.5px}
.bw-done-btn:hover{background:rgba(0,230,118,.22)}
.bw-done-btn:disabled{opacity:.6;cursor:default}
.bw-task-closed{opacity:.4}
.bw-task:last-child{border-bottom:none}
.bw-task-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:3px}
.bw-task-prop{font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;
  color:#fff;letter-spacing:.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bw-task-meta{font-family:'DM Mono',monospace;font-size:11px;color:#b0b0b0;flex-shrink:0;letter-spacing:.5px}
.bw-task-body{font-family:'Barlow',sans-serif;font-size:14px;color:#e8e8e8;line-height:1.3}
.bw-task-who{color:#b0b0b0;font-size:12px}
.bw-mgr-pill{display:inline-block;font-family:'Barlow Condensed',sans-serif;font-size:10px;
  font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:#aaa;
  background:rgba(255,255,255,.04);border:1px solid #222;border-radius:3px;
  padding:1px 6px;margin-left:6px;vertical-align:middle}
.bw-keycode{display:inline-block;font-family:'DM Mono',monospace;font-size:12px;
  font-weight:700;letter-spacing:.5px;color:#ffd24a;
  background:rgba(255,200,60,.12);border:1px solid rgba(255,200,60,.35);border-radius:4px;
  padding:1px 7px;margin-left:8px;vertical-align:middle;white-space:nowrap}

/* Staff list rows (Today's Staff panel) */
.staff-row{display:flex;align-items:center;justify-content:space-between;
  padding:10px 0;border-bottom:1px solid #111;gap:12px}
.staff-row:last-child{border-bottom:none}
.staff-name{font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;
  color:#fff;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.staff-pills{display:flex;gap:6px;align-items:center;flex-shrink:0}
.staff-total{font-family:'DM Mono',monospace;font-size:14px;font-weight:700;color:#fff;
  background:rgba(255,255,255,.08);padding:3px 10px;border-radius:3px;min-width:36px;text-align:center}
.staff-pill{font-family:'DM Mono',monospace;font-size:11px;font-weight:700;
  padding:2px 8px;border-radius:3px;min-width:38px;text-align:center;letter-spacing:.5px}
.staff-pill.ip{color:#f4a261;background:rgba(244,162,97,.14)}
.staff-pill.dn{color:#00e676;background:rgba(0,230,118,.14)}
.staff-pill.is{color:#ff4466;background:rgba(255,68,102,.14)}
.staff-pill.zero{color:#333;background:rgba(255,255,255,.03)}
.bw-count.zero{color:#222;background:#0a0a14}
.bw-count.ns{color:#aaa;background:rgba(150,150,150,.12)}
.bw-count.ip{color:#f4a261;background:rgba(244,162,97,.12)}
.bw-count.dn{color:#00e676;background:rgba(0,230,118,.12)}
.bw-count.is{color:#ff4466;background:rgba(255,68,102,.12)}
.bw-count-label{font-family:'Barlow Condensed',sans-serif;font-size:9px;font-weight:700;
  letter-spacing:1.5px;text-transform:uppercase;color:#555;margin-bottom:2px}

/* ── LOADING ── */
.loader{position:fixed;inset:0;background:#0d0d1a;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:16px;z-index:400}
.spin{width:44px;height:44px;border:3px solid #1a1a30;border-top-color:#00e5ff;
  border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.load-txt{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;
  letter-spacing:3px;text-transform:uppercase;color:#333}

/* ── RESPONSIVE ── */
@media(max-width:900px){
  .wb{grid-template-columns:repeat(3,1fr)}
  .section-bar{grid-column:span 3}
  .t-num{font-size:60px}
}
@media(max-width:600px){
  /* Detail popup goes full screen width on phones so the wording isn't squashed */
  .overlay{padding:0}
  .panel{max-width:none;border-radius:0}
  .wb{grid-template-columns:repeat(2,1fr);gap:3px;padding:3px}
  .section-bar{grid-column:span 2;height:22px}
  .section-bar-label{font-size:9px;letter-spacing:2px}
  .hdr{padding:0 8px;height:46px}
  .hdr-date{display:none}
  .hdr-logo{font-size:15px;letter-spacing:2px}
  .hdr-clock{font-size:14px}
  .hdr-center{gap:0;flex:1;justify-content:center}
  .date-btn{padding:0 8px;height:46px;font-size:10px;letter-spacing:1px}
  .hdr-right{gap:10px}
  .rtime{display:none}

  /* Tiles — give them a fixed sensible height and shrink the big number
     so the subtitle still fits below it */
  .tile{padding:8px 10px;min-height:96px}
  .t-label{font-size:10px;letter-spacing:1px}
  .t-num{font-size:42px;flex:0 0 auto}
  .t-num.md{font-size:34px}
  .t-num.xs{font-size:18px;line-height:1.2}
  .t-sub{font-size:9px;letter-spacing:.3px}

  /* The "By Estate" tile is spanning 2 columns and has its own list */
  .est-list{padding:4px 0;gap:4px}
  .est-list-row{font-size:15px}
  .est-list-row .est-vals{font-size:12px}
  /* Tall enough for 5 estate rows + label + sub */
  .tile.estate-overview-tile{min-height:170px;padding:10px 14px}
}
</style>
</head>
<body>

<div class="loader" id="loader">
  <div class="spin"></div>
  <div class="load-txt">Loading live data...</div>
</div>

<!-- HEADER -->
<div class="hdr">
  <div class="hdr-logo">Ops <span>Live</span></div>
  <div class="hdr-center">
    <div class="date-btn" onclick="setDay(-1,this)">Yesterday</div>
    <div class="date-btn on" onclick="setDay(0,this)">Today</div>
    <div class="date-btn" onclick="setDay(1,this)">Tomorrow</div>
    <div class="date-btn" onclick="setDay(2,this)">+2 Days</div>
  </div>
  <div class="hdr-right">
    <div class="refresh-wrap">
      <div class="rdot"></div>
      <div class="rtime" id="rtime">--:--</div>
    </div>
    <div class="hdr-date" id="hdrDate"></div>
    <div class="hdr-clock" id="hdrClock"></div>
  </div>
</div>

<!-- WALLBOARD -->
<div class="wb" id="wb"></div>

<!-- DETAIL OVERLAY -->
<div class="overlay" id="overlay" onclick="closePanel(event)">
  <div class="panel" id="panel">
    <div class="panel-hdr">
      <div class="panel-title" id="panelTitle"></div>
      <button class="panel-close" onclick="closePanel()">✕</button>
    </div>
    <div class="panel-action" id="panelAction" style="display:none">
      <a id="panelBwLink" href="#" target="_blank">Open in Breezeway ↗</a>
    </div>
    <div class="panel-body" id="panelBody"></div>
  </div>
</div>

<script>
const DASHBOARD_JSON = 'https://raw.githubusercontent.com/CotsRet/dashboard/main/dashboard.json';
const BW_JSON        = 'https://raw.githubusercontent.com/CotsRet/dashboard/main/breezeway.json';
const KEYCODES_JSON  = 'https://raw.githubusercontent.com/CotsRet/dashboard/main/keycodes.json';
const BW_APP_URL     = 'https://app.breezeway.io';
const BW_WORKER_URL  = 'https://bw-webhook.quiet-rice-2699.workers.dev/';
// Close passphrase. Persisted PER DEVICE in localStorage so it survives page
// reloads (useful on the parks where the screen reloads a lot). It is NOT in the
// page source. Trade-off accepted: the phrase lives on this device once entered;
// use "Forget passphrase" to clear it (e.g. before handing the device on).
const BW_SECRET_KEY = 'bw_close_secret';
let bwSecret = (function(){
  try { return localStorage.getItem(BW_SECRET_KEY) || null; } catch(e){ return null; }
})();

// After a successful close, update the in-memory BW data immediately so EVERY
// view on this device (tiles + open panel) reflects it at once, rather than
// waiting for the GitHub re-fetch (which can lag behind the worker). The
// delayed fetchAll still runs afterwards to confirm against the source of truth.
function bwApplyLocalClose(taskId){
  if (!_bwData || !Array.isArray(_bwData.properties)) return;
  for (const p of _bwData.properties){
    const t = (p.tasks || []).find(x => x.id === taskId);
    if (!t) continue;
    const cls = t.classification;                  // not_started / in_progress / issues
    if (p[cls] != null) p[cls] = Math.max(0, p[cls] - 1);
    if (_bwData.summary && _bwData.summary[cls] != null)
      _bwData.summary[cls] = Math.max(0, _bwData.summary[cls] - 1);
    // Move it to completed so it stays visible (greyed) rather than vanishing.
    t.classification = 'completed';
    t.status_code = 'closed';
    t.finished_at = t.finished_at || new Date().toISOString();
    if (p.completed != null) p.completed += 1;
    if (_bwData.summary && _bwData.summary.completed != null) _bwData.summary.completed += 1;
    break;
  }
  render();                                         // refresh the tiles
  if (_currentPanel) showPanel(_currentPanel);      // refresh the open list
}

// Close a Breezeway task via the Worker. Optimistic: grey the row immediately,
// then refresh data after. Reverts visually on failure.
// ── COMPLETION QUEUE ──────────────────────────────────────────────────
// A close can fail transiently: Breezeway's auth endpoint is rate-limited (1/min), or the
// signal drops on the parks mid-tap. Making staff read "Breezeway is busy" and remember to
// tap again is a poor deal — they're carrying laundry. So instead we QUEUE the completion
// and retry it quietly in the background until it lands.
// SAFE TO RETRY: the Worker returns "already_closed" if the close actually went through, so
// a duplicate attempt can't double-close or do harm.
// The queue is kept in localStorage, so a completion tapped on a flaky connection survives a
// page reload instead of being silently lost.
const BW_QUEUE_KEY = 'bw_close_queue';
const BW_QUEUE_MAX_TRIES = 30;          // ~10 min of retrying before we admit defeat
let _bwQueue = [];
let _bwQueueTimer = null;

function bwQueueLoad(){
  try { _bwQueue = JSON.parse(localStorage.getItem(BW_QUEUE_KEY) || '[]') || []; }
  catch(e){ _bwQueue = []; }
}
function bwQueueSave(){
  try { localStorage.setItem(BW_QUEUE_KEY, JSON.stringify(_bwQueue)); } catch(e){}
}
function bwQueued(taskId){ return _bwQueue.some(q => q.taskId === taskId); }

function bwQueueAdd(item){
  if (bwQueued(item.taskId)) return;
  _bwQueue.push({...item, tries: 0});
  bwQueueSave(); bwQueueBadge(); bwQueueStart();
}
function bwQueueRemove(taskId){
  _bwQueue = _bwQueue.filter(q => q.taskId !== taskId);
  bwQueueSave(); bwQueueBadge();
}
function bwQueueStart(){
  if (_bwQueueTimer || !_bwQueue.length) return;
  setTimeout(bwQueueFlush, 3000);                      // first retry soon
  _bwQueueTimer = setInterval(bwQueueFlush, 20000);    // then every 20s
}
function bwQueueStop(){
  if (_bwQueueTimer){ clearInterval(_bwQueueTimer); _bwQueueTimer = null; }
}

// Send the oldest queued completion. One at a time — gentle on the rate limit.
async function bwQueueFlush(){
  if (!_bwQueue.length){ bwQueueStop(); return; }
  if (!bwAccessEmail) return;
  const item = _bwQueue[0];
  item.tries = (item.tries || 0) + 1;
  bwQueueSave();
  try {
    const r = await fetch(BW_WORKER_URL, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({action:'close', taskId:item.taskId, propId:item.propId,
                            propName:item.propName, taskName:item.taskName,
                            accessEmail: bwAccessEmail})
    });
    const d = await r.json().catch(()=>({}));
    if (d && (d.status === 'ok' || d.status === 'already_closed')){
      bwQueueRemove(item.taskId);
      bwApplyLocalClose(item.taskId);
      if (!_bwQueue.length){ bwQueueStop(); setTimeout(fetchAll, 2000); }
      return;
    }
    if (r.status === 401){
      // Not authorised — retrying will never fix that. Drop it and say so plainly.
      bwQueueRemove(item.taskId);
      window.alert('Could not complete \u201c' + item.taskName + '\u201d \u2014 your login isn\u2019t authorised to close tasks.');
      return;
    }
    // 429 / 5xx / anything else: leave it queued and try again on the next tick.
  } catch(e){
    // Offline or the request died — keep it queued.
  }
  if (item.tries >= BW_QUEUE_MAX_TRIES){
    bwQueueRemove(item.taskId);
    window.alert('Still couldn\u2019t complete \u201c' + item.taskName + '\u201d at ' + item.propName +
                 ' after several attempts. Please close it in Breezeway.');
  }
  bwQueueBadge();
}

// Never let a queued completion be invisible — show a small badge. Tapping it retries now.
function bwQueueBadge(){
  let el = document.getElementById('bwQueueBadge');
  if (!_bwQueue.length){ if (el) el.remove(); return; }
  if (!el){
    el = document.createElement('div');
    el.id = 'bwQueueBadge';
    el.className = 'bw-queue-badge';
    el.title = 'Tap to retry now';
    el.onclick = bwQueueFlush;
    document.body.appendChild(el);
  }
  const n = _bwQueue.length;
  el.textContent = '\u23F3 ' + n + ' completion' + (n === 1 ? '' : 's') + ' queued \u2014 retrying\u2026';
}

async function closeBwTask(taskId, propId, propName, taskName, btn){
  // Access-only: the login IS the identity, so no passphrase.
  if (!bwAccessEmail){ window.alert('Please sign in to close tasks.'); return; }
  if (!window.confirm('Close \u201c' + taskName + '\u201d at ' + propName + '?')) return;

  const taskEl = btn.closest('.bw-task');
  if (taskEl){ taskEl.style.opacity = '0.45'; }
  btn.disabled = true; btn.textContent = 'closing\u2026';

  try {
    const r = await fetch(BW_WORKER_URL, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({action:'close', taskId, propId, propName, taskName, accessEmail: bwAccessEmail})
    });
    const d = await r.json().catch(()=>({}));
    if (r.status === 401){
      if (taskEl){ taskEl.style.opacity = ''; }
      btn.disabled = false; btn.textContent = 'Completed';
      if (bwAccessEmail){
        // Logged in via Access, but this email isn't on the Worker's close list yet.
        window.alert('Your login (' + bwAccessEmail + ') isn\u2019t authorised to close tasks yet. Ask Lee to add you.');
      } else {
        bwSaveSecret(null);                         // wrong/changed passphrase - clear stored & re-prompt next time
        window.alert('Passphrase rejected. Tap Completed again to re-enter it.');
      }
      return;
    }
    if (d && d.status === 'ok'){
      btn.textContent = '\u2713 Completed';
      if (taskEl){ taskEl.classList.add('bw-task-closed'); }
      bwApplyLocalClose(taskId);                    // update in-memory data + all views NOW
      setTimeout(fetchAll, 4000);                   // confirm against the worker-refreshed file
    } else if (d && d.status === 'already_closed'){
      // Someone else completed it and this screen was stale — not an error.
      btn.textContent = '\u2713 Already done';
      if (taskEl){ taskEl.classList.add('bw-task-closed'); }
      bwApplyLocalClose(taskId);                    // drop it from this device too
      setTimeout(fetchAll, 2000);
    } else {
      // Transient failure (Breezeway rate-limited, or a wobble). Don't hand the person an
      // error and ask them to remember to tap again — queue it and keep trying in the
      // background. The badge tells them it's in hand.
      btn.disabled = true; btn.textContent = '\u23F3 Queued';
      if (taskEl){ taskEl.style.opacity = '0.6'; }
      bwQueueAdd({taskId, propId, propName, taskName});
    }
  } catch(e){
    // Network dropped mid-tap (very common on the parks) — same treatment: queue it.
    btn.disabled = true; btn.textContent = '\u23F3 Queued';
    if (taskEl){ taskEl.style.opacity = '0.6'; }
    bwQueueAdd({taskId, propId, propName, taskName});
  }
}

// Pull the pitch code off the end of a BW property name and return its key code,
// or '' if there's no match. BW names look like "HB Cotswold Reach CR79" or
// "HB Duckling View - ST61" — the pitch code is the last token. We normalise
// (strip spaces, uppercase) so the sheet's "WLM 38" matches the data's "WLM38".
function keyCodeForProperty(name){
  if (!name || !_keyCodes) return '';
  // Last whitespace-separated token, stripped of any stray punctuation.
  const tokens = String(name).trim().split(/\s+/);
  let last = tokens[tokens.length - 1] || '';
  last = last.replace(/[^A-Za-z0-9]/g, '').toUpperCase();
  if (!last) return '';
  return _keyCodes[last] || '';
}

// Reorder a clean board property name for DISPLAY only: park prefix stays first,
// then the plot/pitch code, then the property name.
//   "HB Cotswold Reach CR79"  ->  "HB CR79 Cotswold Reach"
// Only names that start with a known park prefix AND end in a plot code (last
// token containing a digit) are reordered; every other BW name is returned
// unchanged so odd/duplicate names are never mangled. Display only — the RAW
// name is still what we sort on and pass to keyCodeForProperty().
const BW_PARK_PREFIXES = new Set(['HB','LP','LME','WR']);
function bwDisplayName(name){
  if (!name) return name;
  const toks = String(name).replace(/\s+/g,' ').trim().split(' ');
  if (toks.length < 3 || !BW_PARK_PREFIXES.has(toks[0]) || !/\d/.test(toks[toks.length-1])) return name;
  const plot = toks[toks.length-1];
  const middle = toks.slice(1,-1);
  while (middle.length && /^[-–—]+$/.test(middle[middle.length-1])) middle.pop();
  if (!middle.length) return name;
  return toks[0] + ' ' + plot + ' ' + middle.join(' ');
}

// Ordering helpers: sort rows by plot code (natural: ST7 < ST16 < ST101) while
// keeping parks grouped (prefix first). Non-park/duplicate names sort after parks.
function bwPlotSortKey(name){
  const toks = String(name||'').trim().split(/\s+/);
  const prefix = BW_PARK_PREFIXES.has(toks[0]) ? toks[0] : '~' + (toks[0]||'');
  const code = (toks[toks.length-1]||'').replace(/[^A-Za-z0-9]/g,'').toUpperCase();
  const m = code.match(/^([A-Za-z]*)(\d*)/) || ['','',''];
  return {prefix, alpha:m[1]||'', num:m[2]!==''?parseInt(m[2],10):Infinity, name:String(name||'')};
}
function bwPlotCompare(an, bn){
  const a=bwPlotSortKey(an), b=bwPlotSortKey(bn);
  return a.prefix.localeCompare(b.prefix) || a.alpha.localeCompare(b.alpha) || (a.num-b.num) || a.name.localeCompare(b.name);
}

}

// Honest staleness indicator. Shows last SUCCESSFUL update time; if the data is
// older than STALE_MS (recent fetches failing, e.g. poor signal on the parks),
// it turns into a visible warning — and is forced visible even on mobile, where
// the normal time is otherwise hidden.
function updateFreshness(){
  const el  = document.getElementById('rtime');
  const dot = document.querySelector('.rdot');
  if (!el) return;
  if (!_lastGood){
    el.textContent = _fetchOk ? '--:--' : 'connecting\u2026';
    return;
  }
  const ageMin = Math.floor((Date.now() - _lastGood) / 60000);
  const stale = (Date.now() - _lastGood) > STALE_MS;
  const hhmm = new Date(_lastGood).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
  if (stale){
    el.textContent = '\u26a0 stale \u2013 ' + (ageMin >= 1 ? ageMin + 'm old' : 'updating\u2026');
    el.style.color = '#ff4466';
    el.style.display = 'block';            // override the mobile hide when stale
    if (dot){ dot.style.background = '#ff4466'; dot.style.boxShadow = '0 0 6px #ff4466'; }
  } else {
    el.textContent = hhmm;
    el.style.color = '';
    el.style.display = '';                  // back to stylesheet default (hidden on mobile)
    if (dot){ dot.style.background = ''; dot.style.boxShadow = ''; }
  }
}

// ── UPDATE BW TILES ──────────────────────────────────────────────────────────
function updateBWTiles(){
  const bw = _bwData;
  const s  = bw.summary;
  if(!s) return;
  const set = (id, val) => { const el=document.getElementById(id); if(el) el.textContent=val; };
  // The tiles MUST agree with what the panels show. For a scoped user (staff, seeing
  // only their own tasks) an estate-wide "16 Not Started" above a list of 3 looks
  // broken and invites "I couldn't see it" — so count from the tasks THIS person sees.
  // Lee (scope 'all') keeps the Worker's own summary, so nothing changes for him.
  const mine = (_viewScope === 'mine' && _myBwId);
  let c = null, propCount = 0, scopedTotal = 0;
  if (mine){
    const scoped = bwScopedTasks();
    c = {not_started:0, in_progress:0, completed:0, issues:0};
    scoped.forEach(t => { if (c[t.classification] !== undefined) c[t.classification]++; });
    propCount = new Set(scoped.map(t => t.propertyId)).size;
    scopedTotal = scoped.length;
  }
  set('bwNotStarted', mine ? c.not_started : s.not_started);
  set('bwInProgress', mine ? c.in_progress : s.in_progress);
  set('bwCompleted',  mine ? c.completed   : s.completed);
  set('bwIssues',     mine ? c.issues      : s.issues);
  set('bwTotal',      mine ? scopedTotal   : (bw.total_tasks || 0));
  set('bwProps',      (mine ? propCount : (bw.properties||[]).length) + ' properties today');
  set('bwSource',     'LIVE · ' + (bw._date||''));
  // Today's Staff tile
  const staff = bwStaffSummary();
  set('bwStaffCount', staff.length);
  set('bwStaffSub',   staff.length === 1 ? 'person working today · tap for list' : 'people working today · tap for list');
  // Estate overview tile — compact list of estate counts
  const estates = bwEstateSummary();
  const estList = document.getElementById('estList');
  if (estList) {
    estList.innerHTML = estates.map(e => {
      const dim = e.total === 0 ? ' dim' : '';
      const vals = e.total === 0 ? '—' : `${e.completed}/${e.total}`;
      return `<div class="est-list-row${dim}">
        <span class="est-code">${e.code}</span>
        <span class="est-vals">${vals}</span>
      </div>`;
    }).join('');
  }
  // Turn issues tile red if there are issues
  const t3 = document.getElementById('bwTile3');
  if(t3) t3.style.background = s.issues > 0 ? '#3a0010' : '';
}

// Estates — display order matters here, tiles render in this order
const BW_ESTATES = [
  {code: 'HB',       label: 'Hoburne Park',  match: n => /^HB\s/i.test(n)},
  {code: 'LP',       label: 'Lake Pochard',  match: n => /^LP\s/i.test(n)},
  {code: 'LME',      label: 'Lower Mill',    match: n => /^LME\s/i.test(n)},
  {code: 'WR',       label: 'Windrush Lake', match: n => /^WR\s/i.test(n)},
  {code: 'Hareside', label: 'Hareside',      match: n => /^Hareside/i.test(n)}
];

// Property names we never want counted in any estate (booking-only, not managed)
const BW_IGNORE_PROPERTY_NAMES = new Set(['Why Not']);

function bwEstateForProperty(name){
  if (!name) return null;
  for (const e of BW_ESTATES) {
    if (e.match(name)) return e.code;
  }
  return null;
}

// Per-estate aggregate. Counts UNIQUE tasks (a task with 2 assignees still
// counts once for its estate — Q2 from our earlier conversation).
function bwEstateSummary(){
  const result = BW_ESTATES.map(e => ({
    code: e.code,
    label: e.label,
    total: 0, not_started: 0, in_progress: 0, completed: 0, issues: 0,
    propertyCount: 0
  }));
  const byCode = {};
  result.forEach(r => { byCode[r.code] = r; });

  for (const prop of (_bwData.properties || [])) {
    const name = prop.name || '';
    if (BW_IGNORE_PROPERTY_NAMES.has(name)) continue;
    const code = bwEstateForProperty(name);
    if (!code) continue;
    const r = byCode[code];
    r.propertyCount++;
    r.total       += prop.total       || 0;
    r.not_started += prop.not_started || 0;
    r.in_progress += prop.in_progress || 0;
    r.completed   += prop.completed   || 0;
    r.issues      += prop.issues      || 0;
  }
  return result;
}

// Build a per-staff summary across all tasks for today.
// Counts unique tasks each person is assigned to, broken down by status.
// "Not Started" tasks are excluded from the per-status pills (they're not
// really "owned" yet) but ARE included in the total.
function bwStaffSummary(){
  const tasks = bwAllTasks();
  const byName = {};  // name -> { total, in_progress, completed, issues, not_started }

  for (const t of tasks) {
    const list = Array.isArray(t.assignedToList) && t.assignedToList.length
      ? t.assignedToList
      : (t.assignedTo ? [t.assignedTo] : []);
    if (!list.length) continue;

    // Tidy each name (collapse whitespace) and dedupe within a single task
    const seen = new Set();
    for (const raw of list) {
      const name = (raw || '').replace(/\s+/g, ' ').trim();
      if (!name) continue;
      if (seen.has(name)) continue;
      seen.add(name);
      if (!byName[name]) {
        byName[name] = {name, total: 0, in_progress: 0, completed: 0, issues: 0, not_started: 0};
      }
      const s = byName[name];
      s.total++;
      if (t.classification === 'in_progress')      s.in_progress++;
      else if (t.classification === 'completed')   s.completed++;
      else if (t.classification === 'issues')      s.issues++;
      else if (t.classification === 'not_started') s.not_started++;
    }
  }

  // Hide anyone with zero tasks; sort by total descending then by name
  return Object.values(byName)
    .filter(s => s.total > 0)
    .sort((a, b) => {
      if (b.total !== a.total) return b.total - a.total;
      return a.name.localeCompare(b.name);
    });
}

// ── BW TASK HELPERS ──────────────────────────────────────────────────────────
// Flatten all tasks from all properties into a single array.
// Each task gets the property name attached so we can group/display by property.
function bwAllTasks(){
  const out = [];
  (_bwData.properties || []).forEach(p => {
    (p.tasks || []).forEach(t => {
      out.push({...t, propertyName: p.name || 'Unknown', propertyId: p.id});
    });
  });
  return out;
}

// Tasks this person is allowed to see, BEFORE any ad-hoc filtering. Staff are scoped to
// their own tasks; Lee sees everything. If we couldn't identify them in Breezeway we
// deliberately show EVERYTHING rather than an empty board — an empty board looks broken
// and would hide real work, which is far worse than showing too much.
function bwScopeList(arr){
  if (_viewScope !== 'mine' || !_myBwId) return arr;
  return arr.filter(t => (t.assigneeIds || []).includes(_myBwId));
}
function bwScopedTasks(){ return bwScopeList(bwAllTasks()); }

// Filter tasks by classification, sort by property name (alphabetical), then by task name
function bwTasksByStatus(classification){
  return bwScopedTasks()
    .filter(t => t.classification === classification)
    .sort((a, b) => {
      const np = bwPlotCompare(a.propertyName, b.propertyName);
      if (np !== 0) return np;
      return (a.name || '').localeCompare(b.name || '');
    });
}

// ── BW TASK FILTERS ──────────────────────────────────────────────────────────
// Filter the BW task panels by DEPARTMENT and/or TASK NAME. Department pills are
// built from the data itself (breezeway.json already carries `department` on every
// task), so they always match what Breezeway actually returns and pick up any new
// department automatically — nothing to hardcode or maintain.
// Filters persist as you move between the task panels; the bar always shows what's
// active, the match count, and a Clear button, so a filtered view is never a mystery.
let _bwFiltDept = 'all';    // department code, or 'all'
let _bwFiltText = '';       // free-text match on task name
let _bwFiltMine = false;    // only tasks I'm assigned to
let _bwFiltSrc  = 'all';    // 'all' | 'auto' (from a BW template) | 'staff' (hand-raised)
let _bwFiltType = 'all';    // exact task name, or 'all'

// Who am I, in Breezeway terms? The board knows my Access login email; the Worker maps
// it to my BW person id (the email->person map lives only in the Worker). Needed for the
// "My tasks" filter, which matches on BW person id rather than on names (names are
// fragile: spacing, spelling, duplicates). If the email isn't mapped, _myBwId stays null
// and the My-tasks pill is simply not offered.
let _myBwId = null, _myName = null;

// What THIS person sees. Set from the Worker (whoami) so it's configured in one place.
//   _viewScope   'all'  = every task (Lee)   | 'mine' = only their own tasks (staff)
//   _showFilters  true  = full filter bar    | false  = no filter UI at all
// Safe defaults until whoami answers: show everything, no filters.
let _viewScope   = 'all';
let _showFilters = false;

async function detectMe(){
  if (!bwAccessEmail) return;
  try {
    const r = await fetch(BW_WORKER_URL, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({action:'whoami', accessEmail: bwAccessEmail})
    });
    if (!r.ok) return;
    const d = await r.json();
    if (d && d.bwId){ _myBwId = d.bwId; _myName = d.name || null; }
    if (d && d.scope)   _viewScope   = d.scope;
    if (d && d.filters) _showFilters = (d.filters === 'full');
    // whoami answers after the first paint — re-render so the scope actually applies.
    updateBWTiles();
    if (_currentPanel) showPanel(_currentPanel);
  } catch(e){ /* no scoping/filters; the board still works, showing everything */ }
}

function bwEsc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// Distinct departments present in today's tasks, sorted.
function bwDepartments(){
  const set = new Set();
  bwScopedTasks().forEach(t => { const d = (t.department || '').trim(); if (d) set.add(d); });
  return [...set].sort((a,b) => a.localeCompare(b));
}

// "turnaround_clean" -> "Turnaround Clean"
function bwDeptLabel(d){
  return String(d).replace(/[_-]+/g,' ').replace(/\b\w/g, c => c.toUpperCase());
}

// Distinct task names ("task types"), most common first. The auto/template tasks repeat
// (Guest Arrival check, External Inspection...), so a pick-list is quicker than typing;
// staff-raised one-offs are better served by the search box.
function bwTaskTypes(){
  const c = {};
  bwScopedTasks().forEach(t => { const n = (t.name || '').trim(); if (n) c[n] = (c[n]||0)+1; });
  return Object.keys(c)
    .sort((a,b) => (c[b]-c[a]) || a.localeCompare(b))
    .map(n => ({name:n, count:c[n]}));
}

// Apply the active filters to an array of tasks. All filters COMBINE (AND).
function bwApplyFilters(arr){
  const q = _bwFiltText.trim().toLowerCase();
  return arr.filter(t => {
    // Mine: match on BW person id against EVERY assignee (a task often has several).
    if (_bwFiltMine){
      if (!_myBwId) return false;
      const ids = t.assigneeIds || [];
      if (!ids.includes(_myBwId)) return false;
    }
    if (_bwFiltDept !== 'all' && (t.department || '') !== _bwFiltDept) return false;
    // Source: template_id set = generated from a BW template; null = raised by a person.
    if (_bwFiltSrc === 'auto'  && !t.template_id) return false;
    if (_bwFiltSrc === 'staff' &&  t.template_id) return false;
    if (_bwFiltType !== 'all' && (t.name || '') !== _bwFiltType) return false;
    if (q && !(t.name || '').toLowerCase().includes(q)) return false;
    return true;
  });
}

function bwFiltersActive(){
  return _bwFiltMine || _bwFiltDept !== 'all' || _bwFiltSrc !== 'all'
      || _bwFiltType !== 'all' || _bwFiltText.trim() !== '';
}

// The filter bar. Departments are passed by INDEX (not value) to sidestep any
// quoting issues with odd department names.
function bwFilterBar(shown, total){
  // Staff see only their own tasks and get NO filter controls at all — nothing to
  // misuse, nothing to explain, and no way to hide one of their own jobs behind a
  // filter. Just a quiet note so a short list never looks like a broken board.
  if (!_showFilters){
    return (_viewScope === 'mine' && _myBwId)
      ? `<div class="bw-scope-note">\u{1F464} Your tasks${_myName ? ' \u00b7 ' + bwEsc(_myName) : ''} \u2014 showing ${shown}</div>`
      : '';
  }
  const depts = bwDepartments();
  const deptPill = (val, label, idx) =>
    `<button class="bw-filt-pill${_bwFiltDept === val ? ' on' : ''}" onclick="bwSetDeptIdx(${idx})">${bwEsc(label)}</button>`;
  const deptPills = [deptPill('all','All',-1)]
    .concat(depts.map((d,i) => deptPill(d, bwDeptLabel(d), i)))
    .join('');

  const srcPill = (val, label) =>
    `<button class="bw-filt-pill${_bwFiltSrc === val ? ' on' : ''}" onclick="bwSetSrc('${val}')">${label}</button>`;
  const srcPills = srcPill('all','All') + srcPill('auto','Auto') + srcPill('staff','Raised by staff');

  // Only offer "My tasks" if we actually know who this person is in Breezeway.
  const mine = _myBwId
    ? `<button class="bw-filt-mine${_bwFiltMine ? ' on' : ''}" onclick="bwToggleMine()"
        title="Show only tasks I'm assigned to">\u{1F464} My tasks${_myName ? ' \u00b7 ' + bwEsc(_myName) : ''}</button>`
    : '';

  const types = bwTaskTypes();
  const typeSel = types.length
    ? `<select class="bw-filt-sel" onchange="bwSetType(this.value)">
         <option value="all"${_bwFiltType==='all'?' selected':''}>All task types</option>
         ${types.map(t => `<option value="${bwEsc(t.name)}"${_bwFiltType===t.name?' selected':''}>${bwEsc(t.name)} (${t.count})</option>`).join('')}
       </select>`
    : '';

  const clear = bwFiltersActive()
    ? `<button class="bw-filt-clear" onclick="bwClearFilters()">Clear</button>` : '';

  return `<div class="bw-filter">
    ${mine ? `<div class="bw-filt-grp">${mine}</div>` : ''}
    <div class="bw-filt-grp"><span class="bw-filt-lab">Dept</span>${deptPills}</div>
    <div class="bw-filt-grp"><span class="bw-filt-lab">Source</span>${srcPills}</div>
    <div class="bw-filt-row">
      ${typeSel}
      <input id="bwFiltText" class="bw-filt-search" type="text" placeholder="Search task name…"
             value="${bwEsc(_bwFiltText)}" oninput="bwSetText(this.value)" autocomplete="off">
      ${clear}
      <span class="bw-filt-count">${shown} of ${total}</span>
    </div>
  </div>`;
}

// Re-render the open panel after a filter change. The panel body is rebuilt, so the
// search box is recreated — put focus and caret back if the user was typing.
function bwRepaintPanel(refocus){
  if (!_currentPanel) return;
  showPanel(_currentPanel);
  if (refocus){
    const el = document.getElementById('bwFiltText');
    if (el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
  }
}
function bwSetDeptIdx(i){
  const depts = bwDepartments();
  _bwFiltDept = (i < 0) ? 'all' : (depts[i] || 'all');
  bwRepaintPanel(false);
}
function bwSetText(v){ _bwFiltText = v; bwRepaintPanel(true); }
function bwSetSrc(v){ _bwFiltSrc = v; bwRepaintPanel(false); }
function bwSetType(v){ _bwFiltType = v; bwRepaintPanel(false); }
function bwToggleMine(){ _bwFiltMine = !_bwFiltMine; bwRepaintPanel(false); }
function bwClearFilters(){
  _bwFiltDept = 'all'; _bwFiltText = ''; _bwFiltMine = false;
  _bwFiltSrc = 'all';  _bwFiltType = 'all';
  bwRepaintPanel(false);
}

// Standard body for the four status panels: filter bar + rows (or the right empty state).
function bwStatusPanelHTML(allTasks, mode, emptyHTML){
  const tasks = bwApplyFilters(allTasks);
  const body = tasks.length
    ? tasks.map(t => bwTaskRow({...t, _propId:t.propertyId, _propName:t.propertyName}, mode)).join('')
    : (allTasks.length === 0 ? emptyHTML : `<div class="p-empty">No tasks match this filter</div>`);
  return bwFilterBar(tasks.length, allTasks.length) + body;
}

// Format a timestamp like "2026-05-18T13:54:46" → "13:54"
// Breezeway sends UTC timestamps with no zone marker (e.g. "2026-07-29T09:52:23").
// Parse as UTC so times & durations render correctly in UK local time (BST/GMT auto).
function bwParseTs(ts){
  let s = String(ts == null ? '' : ts).trim();
  if (s && !/[Zz]$|[+-]\d{2}:?\d{2}$/.test(s)) s += 'Z';
  return new Date(s);
}

function fmtTaskTime(ts){
  if (!ts) return '';
  const d = bwParseTs(ts);
  if (isNaN(d.getTime())) { const m = String(ts).match(/T(\d{2}:\d{2})/); return m ? m[1] : ''; }
  return d.toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit', timeZone:'Europe/London'});
}

// Format duration since start, e.g. "for 1h 23m"
function fmtElapsed(ts){
  if (!ts) return '';
  const start = bwParseTs(ts);
  if (isNaN(start.getTime())) return '';
  const now = new Date();
  const mins = Math.floor((now - start) / 60000);
  if (mins < 1) return 'just started';
  if (mins < 60) return `for ${mins}m`;
  const h = Math.floor(mins / 60);
  const m = mins % 60;
  return `for ${h}h ${m}m`;
}

// Render a single task row with status-appropriate detail
// Decide what to display for a task's assignees.
// Returns one of:
//   - empty string: no assignees at all
//   - 'managers':   only managers assigned (display a small pill)
//   - 'Name, Name': one or more non-managers (display as names)
function bwDisplayedAssignees(task){
  const list = Array.isArray(task.assignedToList) && task.assignedToList.length
    ? task.assignedToList
    : (task.assignedTo ? [task.assignedTo] : []);
  if (!list.length) return '';
  const nonManagers = list.filter(n => !_isManager(n));
  if (!nonManagers.length) return 'managers';  // sentinel value
  // Also tidy whitespace in displayed names so the UI looks clean
  return nonManagers.map(n => (n || '').replace(/\s+/g, ' ').trim()).join(', ');
}

function bwTaskRow(t, mode){
  const prop = t.propertyName || 'Unknown';
  const name = t.name || '(unnamed)';
  // Key code for this property (shows where it matches; silent otherwise).
  // Only shown when a property name is displayed on the row (Not Started etc.);
  // in the Total Tasks expanded view propertyName is blanked, so the code is
  // shown on the property header instead (avoids duplicating it on every task).
  const kc = t.propertyName ? keyCodeForProperty(t.propertyName) : '';
  const kcPill = kc ? ` <span class="bw-keycode" title="Key code">🔑 ${kc}</span>` : '';
  const assignees = bwDisplayedAssignees(t);
  let who = '';
  if (assignees === 'managers') {
    who = ` <span class="bw-mgr-pill">managers</span>`;
  } else if (assignees) {
    who = ` <span class="bw-task-who">· ${assignees}</span>`;
  }
  let info = '';

  if (mode === 'in_progress') {
    const elapsed = fmtElapsed(t.started_at);
    const startTime = fmtTaskTime(t.started_at);
    info = startTime
      ? `<span style="color:#f4a261">started ${startTime}</span> <span style="color:#999">${elapsed}</span>`
      : '';
  } else if (mode === 'completed') {
    const finishTime = fmtTaskTime(t.finished_at);
    info = finishTime ? `<span style="color:#00e676">finished ${finishTime}</span>` : '';
  } else if (mode === 'issues') {
    const startTime = fmtTaskTime(t.started_at);
    info = startTime ? `<span style="color:#ff4466">paused since ${startTime}</span>` : '<span style="color:#ff4466">paused</span>';
  }

  // Done button: only for outstanding tasks, and only when close context is
  // supplied (lodge-grouped view passes _propId/_propName). Other call sites
  // (flat status panels) omit it. Uses event delegation via a data attribute.
  let doneBtn = '';
  if (mode !== 'completed' && t._propId != null) {
    const esc = s => String(s == null ? '' : s).replace(/'/g, "\\'");
    doneBtn = bwQueued(t.id)
      // Already queued (and the panel has since re-rendered) — show it honestly and don't
      // let them tap it again.
      ? `<button class="bw-done-btn" disabled style="opacity:.65">\u23F3 Queued</button>`
      : `<button class="bw-done-btn" onclick="event.stopPropagation(); closeBwTask(${t.id}, ${t._propId}, '${esc(t._propName)}', '${esc(name)}', this)">Completed</button>`;
  }

  return `<div class="bw-task">
    <div class="bw-task-head">
      <div class="bw-task-prop">${bwDisplayName(prop)}${kcPill}</div>
      <div class="bw-task-meta">${info}</div>
    </div>
    <div class="bw-task-body">${name}${who}</div>
    ${doneBtn}
  </div>`;
}

// ── DETAIL PANELS ─────────────────────────────────────────────────────────────
const ITEMS=['Bath Sheet','Bath Mat','Hand Towel','S King D','S King S','King D','King S','Single D','Single S','Pillow C','Oxford','Tea Towel'];

function showPanel(type){
  _currentPanel = type;
  const ov = document.getElementById('overlay');
  const ti = document.getElementById('panelTitle');
  const bo = document.getElementById('panelBody');
  const panel = document.getElementById('panel');
  const action = document.getElementById('panelAction');
  const bwLink = document.getElementById('panelBwLink');
  panel.style.borderTopColor = '#00e5ff';
  action.style.display = 'none';

  const lodgeList = (arr, status='none', timeField='') => arr.length===0
    ? `<div class="p-empty">No entries for this day</div>`
    : arr.map(b => {
        const g = (b.numAdult||0)+(b.numChild||0);
        const special = timeField && b[timeField] ? `<span style="background:rgba(0,229,255,.15);color:#00e5ff;padding:4px 10px;border-radius:10px;font-size:14px;font-weight:700;">${timeField==='lateCheckout'?'🕐 Late CO':'⏰ Early CI'}: ${b[timeField]}</span>` : '';
const ownerBadge = b.owner ? `<span style="background:rgba(180,120,255,.18);color:#c9a3ff;padding:4px 10px;border-radius:10px;font-size:13px;font-weight:700;margin-left:6px;">👤 OWNER — thorough check</span>` : '';
        const extras = (b.extras && b.extras.length)
          ? `<div style="margin-top:6px;display:flex;flex-wrap:wrap;gap:6px">${b.extras.map(x=>`<span style="background:rgba(255,170,0,.15);color:#ffb733;padding:4px 10px;border-radius:10px;font-size:13px;font-weight:700;">🛎 ${x}</span>`).join('')}</div>`
          : '';
        return `<div class="p-row">
          <div style="flex:1">
            <div class="p-lodge">${b.unitName||b.propName||'Unknown'}</div>
            ${g ? `<div class="p-info">${g} guest${g!==1?'s':''}</div>` : ''}
            ${special}${ownerBadge}
            ${extras}
          </div>
          <div class="p-status s-${status}"></div>
        </div>`;
      }).join('');

  if(type==='deps'){
    ti.textContent=`Departures — ${fmtShort(dayOff)}`;
    bo.innerHTML=lodgeList(_deps,'pending','lateCheckout');
  }
  else if(type==='arrs'){
    ti.textContent=`Arrivals — ${fmtShort(dayOff)}`;
    bo.innerHTML=lodgeList(_arrs,'none','earlyCheckin');
  }
  else if(type==='tmr-deps'){
    ti.textContent=`Tomorrow Departures — ${fmtShort(dayOff+1)}`;
    bo.innerHTML=_tmrDeps.length===0
      ?`<div class="p-empty">Loading...</div>`
      :lodgeList(_tmrDeps,'pending','lateCheckout');
  }
  else if(type==='tmr-arrs'){
    ti.textContent=`Tomorrow Arrivals — ${fmtShort(dayOff+1)}`;
    bo.innerHTML=_tmrArrs.length===0
      ?`<div class="p-empty">Loading...</div>`
      :lodgeList(_tmrArrs,'none','earlyCheckin');
  }
  // ── BW DRILL-DOWN PANELS ─────────────────────────────────────────────
  else if(type==='bw-not-started'){
    ti.textContent='Not Started — Today';
    panel.style.borderTopColor = '#aaa';
    action.style.display = 'flex';
    bwLink.href = BW_APP_URL;
    bo.innerHTML = bwStatusPanelHTML(bwTasksByStatus('not_started'), 'not_started',
      `<div class="p-empty" style="color:#00e676">✓ All tasks started</div>`);
  }
  else if(type==='bw-in-progress'){
    ti.textContent='In Progress — Today';
    panel.style.borderTopColor = '#f4a261';
    action.style.display = 'flex';
    bwLink.href = BW_APP_URL;
    bo.innerHTML = bwStatusPanelHTML(bwTasksByStatus('in_progress'), 'in_progress',
      `<div class="p-empty">Nothing in progress right now</div>`);
  }
  else if(type==='bw-completed'){
    ti.textContent='Completed — Today';
    panel.style.borderTopColor = '#00e676';
    action.style.display = 'flex';
    bwLink.href = BW_APP_URL;
    bo.innerHTML = bwStatusPanelHTML(bwTasksByStatus('completed'), 'completed',
      `<div class="p-empty">Nothing completed yet today</div>`);
  }
  else if(type==='bw-issues'){
    ti.textContent='Issues — Today';
    panel.style.borderTopColor = '#ff4466';
    action.style.display = 'flex';
    bwLink.href = BW_APP_URL;
    bo.innerHTML = bwStatusPanelHTML(bwTasksByStatus('issues'), 'issues',
      `<div class="p-empty" style="color:#00e676">✓ No issues</div>`);
  }
  else if(type==='bw-total'){
    ti.textContent='All Properties — Today';
    panel.style.borderTopColor = '#00e5ff';
    action.style.display = 'flex';
    bwLink.href = BW_APP_URL;
    // Property-level overview (counts grid), now filterable by department / task name.
    const order = {issues:0, in_progress:1, not_started:2, completed:3};
    const filtOn = bwFiltersActive();
    let shownCount = 0, totalCount = 0;
    const rows = [];
    (_bwData.properties || [])
      .slice()
      .sort((a,b) => bwPlotCompare(a.name, b.name))
      .forEach(p => {
        const all = bwScopeList(p.tasks || []);   // staff only see their own tasks
        totalCount += all.length;
        const tasks = bwApplyFilters(all).slice().sort((a,b) => {
          const oa = order[a.classification] ?? 9, ob = order[b.classification] ?? 9;
          if (oa !== ob) return oa - ob;
          return (a.name||'').localeCompare(b.name||'');
        });
        shownCount += tasks.length;
        // When a filter is on, drop lodges with no matching task.
        if (tasks.length || !filtOn) rows.push({p, tasks});
      });
    const legend = `<div style="display:flex;gap:14px;padding:8px 0 12px 0;border-bottom:1px solid #1a1a30;margin-bottom:8px;font-family:'DM Mono',monospace;font-size:11px;color:#999;letter-spacing:1px">
      <span><span class="bw-count ns" style="display:inline-block">NS</span> Not Started</span>
      <span><span class="bw-count ip" style="display:inline-block">IP</span> In Progress</span>
      <span><span class="bw-count dn" style="display:inline-block">DN</span> Done</span>
      <span><span class="bw-count is" style="display:inline-block">IS</span> Issues</span>
    </div>`;
    bo.innerHTML = bwFilterBar(shownCount, totalCount) + (rows.length===0
      ? `<div class="p-empty">${filtOn ? 'No tasks match this filter' : 'No properties have tasks today'}</div>`
      : legend + rows.map(({p, tasks}, i) => {
          // Counts are recomputed from the tasks actually SHOWN, so the grid always
          // agrees with the rows beneath it (filtered or not).
          const c = {not_started:0, in_progress:0, completed:0, issues:0};
          tasks.forEach(t => { if (c[t.classification] !== undefined) c[t.classification]++; });
          const ns = c.not_started, ip = c.in_progress, dn = c.completed, is = c.issues;
          const taskRows = tasks.length
            ? tasks.map(t => bwTaskRow({...t, propertyName:'', _propId:p.id, _propName:p.name}, t.classification)).join('')
            : `<div class="p-empty" style="padding:14px">No task detail</div>`;
          // Filtering is a hunt — auto-expand the matches so you don't have to tap
          // every lodge. Without a filter, keep the usual collapsed overview.
          const op = filtOn ? ' open' : '';
          return `<div class="bw-row expandable${op}" id="bwprop-h-${i}" onclick="toggleProp(${i})">
            <div class="bw-name"><span class="bw-caret" id="bwprop-c-${i}">›</span>${bwDisplayName(p.name || 'Unknown')}${(()=>{const kc=keyCodeForProperty(p.name);return kc?` <span class="bw-keycode" title="Key code">🔑 ${kc}</span>`:'';})()}</div>
            <div class="bw-counts">
              <div class="bw-count ${ns?'ns':'zero'}" title="Not Started">${ns}</div>
              <div class="bw-count ${ip?'ip':'zero'}" title="In Progress">${ip}</div>
              <div class="bw-count ${dn?'dn':'zero'}" title="Completed">${dn}</div>
              <div class="bw-count ${is?'is':'zero'}" title="Issues">${is}</div>
            </div>
          </div>
          <div class="bw-prop-tasks${op}" id="bwprop-t-${i}">${taskRows}</div>`;
        }).join(''));
  }
  else if(type==='bw-staff'){
    ti.textContent='Today\u2019s Staff';
    panel.style.borderTopColor = '#9b6dff';
    action.style.display = 'flex';
    bwLink.href = BW_APP_URL;
    const staff = bwStaffSummary();
    const legend = `<div style="display:flex;gap:12px;padding:6px 0 12px 0;border-bottom:1px solid #1a1a30;margin-bottom:8px;font-family:'DM Mono',monospace;font-size:11px;color:#999;letter-spacing:1px">
      <span><span class="staff-pill ip" style="display:inline-block;min-width:0">IP</span> In Progress</span>
      <span><span class="staff-pill dn" style="display:inline-block;min-width:0">DN</span> Completed</span>
      <span><span class="staff-pill is" style="display:inline-block;min-width:0">IS</span> Issues</span>
    </div>`;
    bo.innerHTML = staff.length === 0
      ? `<div class="p-empty">Nobody assigned to tasks today</div>`
      : legend + staff.map(s => {
          const ipCls = s.in_progress ? 'ip' : 'zero';
          const dnCls = s.completed   ? 'dn' : 'zero';
          const isCls = s.issues      ? 'is' : 'zero';
          return `<div class="staff-row">
            <div class="staff-name">${s.name}</div>
            <div class="staff-pills">
              <div class="staff-total">${s.total}</div>
              <div class="staff-pill ${ipCls}" title="In Progress">${s.in_progress}</div>
              <div class="staff-pill ${dnCls}" title="Completed">${s.completed}</div>
              <div class="staff-pill ${isCls}" title="Issues">${s.issues}</div>
            </div>
          </div>`;
        }).join('');
  }
  else if(type==='estate-overview'){
    ti.textContent='By Estate — Today';
    panel.style.borderTopColor = '#9b6dff';
    action.style.display = 'flex';
    bwLink.href = BW_APP_URL;
    const estates = bwEstateSummary();
    const colourClasses = ['c-estate1','c-estate2','c-estate3','c-estate4','c-estate5'];
    bo.innerHTML = `<div class="est-grid">${
      estates.map((e, i) => {
        const cls = colourClasses[i] || 'c-estate1';
        const sub = e.total > 0
          ? `${e.propertyCount} ${e.propertyCount===1?'property':'properties'}${e.issues>0?`, ${e.issues} issue${e.issues!==1?'s':''}`:''}`
          : 'no tasks today';
        const num = e.total > 0 ? `${e.completed}/${e.total}` : '—';
        return `<div class="est-card ${cls}" onclick="showPanel('estate-${e.code}')">
          <div class="est-card-label">${e.label}</div>
          <div class="est-card-num">${num}</div>
          <div class="est-card-sub">${sub}</div>
        </div>`;
      }).join('')
    }</div>`;
  }
  else if(type.startsWith('estate-')){
    const code = type.substring(7);
    const est = BW_ESTATES.find(e => e.code === code);
    const estLabel = est ? est.label : code;
    ti.textContent = estLabel + ' — Today';
    panel.style.borderTopColor = '#9b6dff';
    action.style.display = 'flex';
    bwLink.href = BW_APP_URL;

    // Filter properties belonging to this estate
    const props = (_bwData.properties || [])
      .filter(p => !BW_IGNORE_PROPERTY_NAMES.has(p.name) && bwEstateForProperty(p.name) === code)
      .sort((a,b) => bwPlotCompare(a.name, b.name));

    if (props.length === 0) {
      bo.innerHTML = `<div class="p-empty">No tasks today for ${estLabel}</div>`;
    } else {
      // Top summary band
      const summary = props.reduce((s, p) => {
        s.total       += p.total       || 0;
        s.not_started += p.not_started || 0;
        s.in_progress += p.in_progress || 0;
        s.completed   += p.completed   || 0;
        s.issues      += p.issues      || 0;
        return s;
      }, {total:0, not_started:0, in_progress:0, completed:0, issues:0});

      const summaryBand = `<div style="display:flex;gap:14px;padding:0 0 14px 0;border-bottom:1px solid #1a1a30;margin-bottom:10px;font-family:'DM Mono',monospace;font-size:11px;color:#aaa;letter-spacing:1px;flex-wrap:wrap">
        <span style="color:#fff;font-weight:700">${props.length} ${props.length===1?'property':'properties'}</span>
        <span><span style="color:#aaa">NS</span> ${summary.not_started}</span>
        <span><span style="color:#f4a261">IP</span> ${summary.in_progress}</span>
        <span><span style="color:#00e676">DN</span> ${summary.completed}</span>
        <span><span style="color:#ff4466">IS</span> ${summary.issues}</span>
        <span style="margin-left:auto;color:#fff;font-weight:700">${summary.total} total</span>
      </div>`;

      const legend = `<div style="display:flex;gap:14px;padding:0 0 10px 0;font-family:'DM Mono',monospace;font-size:11px;color:#999;letter-spacing:1px">
        <span><span class="bw-count ns" style="display:inline-block">NS</span> Not Started</span>
        <span><span class="bw-count ip" style="display:inline-block">IP</span> In Progress</span>
        <span><span class="bw-count dn" style="display:inline-block">DN</span> Done</span>
        <span><span class="bw-count is" style="display:inline-block">IS</span> Issues</span>
      </div>`;

      const rows = props.map(p => {
        const ns = p.not_started || 0;
        const ip = p.in_progress || 0;
        const dn = p.completed   || 0;
        const is = p.issues      || 0;
        return `<div class="bw-row">
          <div class="bw-name">${bwDisplayName(p.name || 'Unknown')}</div>
          <div class="bw-counts">
            <div class="bw-count ${ns?'ns':'zero'}" title="Not Started">${ns}</div>
            <div class="bw-count ${ip?'ip':'zero'}" title="In Progress">${ip}</div>
            <div class="bw-count ${dn?'dn':'zero'}" title="Completed">${dn}</div>
            <div class="bw-count ${is?'is':'zero'}" title="Issues">${is}</div>
          </div>
        </div>`;
      }).join('');

      bo.innerHTML = summaryBand + legend + rows;
    }
  }
  // ── GL PANELS ─────────────────────────────────────────────────────────
  else if(type==='gl-alerts'){
    ti.textContent='GL Alerts — Today';
    panel.style.borderTopColor='#ff4466';
    const alerts = (_glData.counts||[]).filter(c=>c.hasShort&&c.date===isoDate(0));
    bo.innerHTML = alerts.length===0
      ? `<div class="p-empty" style="color:#00e676">✓ All clear — no missing items today</div>`
      : alerts.map(a=>`<div class="p-row">
          <div>
            <div class="p-lodge">${a.lodge}</div>
            <div class="p-info">${a.shorts.join(', ')} missing</div>
          </div>
          <div class="p-status s-pending"></div>
        </div>`).join('');
  }
  else if(type==='gl-stock'){
    ti.textContent='GL Linen — Warehouse Stock';
    panel.style.borderTopColor='#00a651';
    const shelf=_glData.shelf||{};
    bo.innerHTML = ITEMS.map(item=>{
      const v=shelf[item]||0;
      const c=v===0?'#ff4466':v<10?'#ffaa00':'#00e676';
      return `<div class="p-row">
        <div class="p-lodge">${item}</div>
        <div class="p-val" style="color:${c}">${v}</div>
      </div>`;
    }).join('');
  }
  else if(type==='gl-watch'){
    ti.textContent='GL Watch List — Items Owed';
    panel.style.borderTopColor='#ffaa00';
    const w=(_glData.watchlist||[]).filter(x=>!x.resolved);
    bo.innerHTML = w.length===0
      ? `<div class="p-empty" style="color:#00e676">✓ Nothing outstanding from GL</div>`
      : w.map(x=>`<div class="p-row">
          <div>
            <div class="p-lodge">${x.item}</div>
            <div class="p-info">From ${x.fromDate} · sent ${x.sent}, received ${x.received}</div>
          </div>
          <div class="p-val" style="color:#ff4466">−${x.short}</div>
        </div>`).join('');
  }

  ov.classList.add('on');
}

function closePanel(e){
  if(!e||e.target===document.getElementById('overlay'))
    document.getElementById('overlay').classList.remove('on');
}

// Expand/collapse a property's task list in the All Properties panel
function toggleProp(i){
  const head = document.getElementById('bwprop-h-'+i);
  const body = document.getElementById('bwprop-t-'+i);
  if(!head||!body) return;
  const open = body.classList.toggle('open');
  head.classList.toggle('open', open);
}

// ── INIT ──────────────────────────────────────────────────────────────────────
fetchAll();
// Access-only: read the logged-in identity for close attribution, then resolve it to a
// Breezeway person id so the "My tasks" filter can be offered.
detectAccessIdentity().then(detectMe);
// Pick up any completions left queued from a previous session (e.g. the app was closed on a
// dead signal) and keep retrying them.
bwQueueLoad(); bwQueueBadge(); bwQueueStart();
setInterval(fetchAll, 10*60*1000); // full refresh every 10 mins
setInterval(renderFromCache, 60*1000); // re-render every minute
setInterval(updateFreshness, 30*1000); // keep the staleness indicator current between fetches

// Refresh BW data every 30 seconds
setInterval(async () => {
  const bw = await fetchBWJSON();
  if(bw && bw._generated) {
    _bwData = bw;
    _lastGood = Date.now();   // a good BW pull counts as fresh data
    _fetchOk = true;
    updateBWTiles();
  } else {
    _fetchOk = false;         // pull failed/empty (e.g. poor signal) — keep old data
  }
  updateFreshness();
}, 30*1000);
</script>
